# Synthetic in-car goals for train-only augmentation (A6). Format and rules:
# docs/augmentation-spec.md (section 3). Each goal is a new user goal, not one of the
# 81 intents, and never near an OOD intent. Its tags are its labels.
# Fix lines in place; do not reorder or delete (row ids use positions).
# Check with: python -m autogate_bench.augment validate --dir data/augment --strict

# ---------------------------------------------------------------- high distraction

- name: set_up_driver_profile
  description: Create a new driver profile with its own name and saved settings
  group: productivity
  capability: local_ok
  distraction: high
  actuation: none
  consequence: reversible
  rationale: a multi-step setup flow with a name typed on the keyboard, which UX_RESTRICTIONS_NO_SETUP and NO_KEYBOARD block while moving; profiles are stored in the car
  utterances:
    - {text: "create a new driver profile for my wife", style: command, variant: plain}
    - {text: "add my son as a second driver with his own settings", style: command, variant: plain}
    - {text: "can you set up a profile for my brother so his seat and music are saved?", style: question, variant: plain}
    - {text: "how do i add another person as a driver in this system", style: question, variant: plain}
    - {text: "my dad drives this car on weekends and keeps messing up my settings", style: outcome, variant: plain}
    - {text: "every time my sister takes the car she has to redo everything from scratch", style: indirect, variant: plain}
    - {text: "new user profile", style: fragment, variant: plain}
    - {text: "papa ke liye alag profile bana do", style: command, variant: hinglish}
    - {text: "amma ge hosa profile maadi", style: command, variant: kannada_english}
    - {text: "add a uh new no a second profile for the driver who um comes on mondays", style: command, variant: disfluent}

