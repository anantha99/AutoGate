  capability: local_ok
  distraction: low
  actuation: restricted
  consequence: reversible
  rationale: DOOR_POS on the HOOD door area (VehicleAreaDoor.HOOD); an unlatched bonnet at speed can fly up and block the view, so parked-only like open_trunk
