# AutoGate seed phrasings.
#
# One top-level key per intent, in the order of autogate_bench.intents.INTENTS.
# Each value is a list of 3 to 5 hand-written seeds: {text: ..., style: ...}.
# Seeds are the unit of the train/val/test split; each is later expanded into
# paraphrases, so seeds within one intent are genuinely different ways of
# asking, never synonyms of each other.
#
# Styles (exactly one per seed):
#   command   an imperative                          "turn on the ac"
#   outcome   a need or situation, no action named   "i need a clean washroom"
#   question  a request phrased as a question        "can you make it a bit quieter"
#   indirect  conversational, the action is implied  "the kids are complaining about the heat"
#   fragment  the terse thing people actually say    "ac off"
#
# Slots are written as {name}. Sensitive slots (filled from synthetic pools,
# offsets recorded for masking): contact, phone, address, otp, card.
# Other slots: place, city, temperature, fan_level, song, artist, station,
# podcast, time, date, duration, team, topic, note_text, message_text,
# event_title, drive_mode, color, speed, seat, window, number.
# {message_text} is always a body the driver dictates, never a received message.
#
# Text rules: plain English, lowercase, ASCII, at most 12 words, no trailing
# punctuation. Checked by tests/test_seeds.py and autogate_bench.seeds.load_seeds.

