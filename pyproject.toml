[project]
name = "autogate"
version = "0.1.0"
description = "AutoGate: a local-cloud router and benchmark for in-car LLM assistants"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=2",
    "pyarrow>=15",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
# Only for autogate_bench.paraphrase_api (regenerating paraphrases with your own key).
api = [
    "anthropic>=1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/autogate_bench",
    "src/autogate_router",
    "src/autogate_eval",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
