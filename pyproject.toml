[project]
name = "autogate"
version = "0.1.0"
description = "AutoGate: a local-cloud router and benchmark for in-car LLM assistants"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=2",
    "pyarrow>=15",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
# Only for autogate_bench.paraphrase_api (regenerating paraphrases with your own key).
api = [
    "anthropic>=1.8",
]
# Zero-shot LLM baselines (autogate_eval.baselines.llm): Claude, and any OpenAI-compatible
# endpoint (OpenAI, Gemini's OpenAI-compatible API, a local vLLM server).
baselines = [
    "anthropic>=1.8",
    "openai>=1.40",
]
# Router training (autogate_router). torch resolves to CPU wheels via the index below;
# on a GPU machine install torch from your CUDA index first, then `pip install -e ".[train]"`.
train = [
    "torch>=2.4",
    "transformers>=4.51",
    "peft>=0.13",
    "accelerate>=1.0",
]
# ONNX export and int8 quantization (autogate_router.export).
export = [
    "onnx>=1.16",
    "onnxruntime>=1.19",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/autogate_bench",
    "src/autogate_router",
    "src/autogate_eval",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
