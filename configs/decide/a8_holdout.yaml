# A8 proxy holdout and probe pairs (docs/plan-a8-finetune-a6.md section 4).
# proxy and probe_pairs: `python -m autogate_decide.holdout pick --seed 0` on the augmented rows
# (2026-11-18, before the A6 audit). keywords: hand-written after the pick, like
# autogate_bench.augment.OOD_KEYWORDS (a goal whose name or description has every word of an
# entry, as word prefixes, is dropped during selection runs). Never edit after the first A8 run.
seed: 0
proxy:  # real OOD intent: proxy training intent (same capability, distraction, actuation)
  compose_long_email: read_document
  estimate_trip_cost: send_text_message
  fog_lights_on: emergency_call
  open_fuel_door: disable_lane_assist
  pair_bluetooth_device: play_video
  read_news_headlines: book_restaurant
  route_avoiding_tolls: fuel_prices_nearby
  set_ambient_lighting: adjust_window
keywords:
  read_document: [["document"], ["pdf"], ["read", "file"]]
  send_text_message: [["text", "message"], ["send", "text"], ["sms"], ["whatsapp"]]
  emergency_call: [["emergency"], ["ambulance"], ["112"], ["police"]]
  disable_lane_assist: [["lane"]]
  play_video: [["video"], ["movie"]]
  book_restaurant: [["restaurant"], ["reserve", "table"], ["book", "table"]]
  fuel_prices_nearby: [["fuel", "price"], ["petrol", "price"], ["diesel", "price"]]
  adjust_window: [["window"]]
