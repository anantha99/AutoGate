# Full router training: Qwen3-0.6B + LoRA + three heads, on one GPU (e.g. a Kaggle T4/P100).
# python -m autogate_router.train --config configs/train_qwen3_0.6b.yaml
# Any key can be overridden on the command line (--lr 1e-4, --no-context, ...).
rows: data/generated/full/rows.jsonl
train_split: train
val_split: val
out_dir: checkpoints/qwen3-0.6b
backbone: Qwen/Qwen3-0.6B
pooling: mean
context: true
max_length: 96
lora: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
head_dropout: 0.1
class_weights: true
lambda_intent: 0.5
lambda_span: 1.0
epochs: 3
batch_size: 32
eval_batch_size: 128
lr: 2.0e-4
head_lr: null  # heads use lr too; set e.g. 1.0e-3 to train them faster
weight_decay: 0.01
warmup_ratio: 0.06
grad_accum: 1
max_grad_norm: 1.0
precision: auto
seed: 0
log_every: 50
eval_n_boot: 200
